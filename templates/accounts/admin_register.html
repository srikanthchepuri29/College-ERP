{% extends 'base.html' %}

{% block title %}Administrator Registration - College ERP{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh; py-5;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            
            <div class="text-center mb-4">
                <a href="{% url 'home' %}" class="navbar-brand fs-3 text-decoration-none">
                    <i class="bi bi-mortarboard-fill me-2 text-primary"></i>College<span>ERP</span>
                </a>
            </div>

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-danger p-4 text-white text-center">
                    <h4 class="mb-1"><i class="bi bi-shield-plus me-2"></i>Admin Register</h4>
                    <p class="mb-0 small text-light opacity-75">Demo registration with Admin Secret Code</p>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" id="username" class="form-control bg-light" placeholder="e.g. administrator" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control bg-light" placeholder="admin@college.edu" required>
                        </div>
                        
                        <div class="mb-3">
                            <div class="row g-2">
                                <div class="col-6">
                                    <label for="first_name" class="form-label small fw-semibold">First Name</label>
                                    <input type="text" name="first_name" id="first_name" class="form-control bg-light" required>
                                </div>
                                <div class="col-6">
                                    <label for="last_name" class="form-label small fw-semibold">Last Name</label>
                                    <input type="text" name="last_name" id="last_name" class="form-control bg-light" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" id="password" class="form-control bg-light" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4">
                            <label for="secret_code" class="form-label small fw-semibold text-danger">Admin Registration Secret Code</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-danger"></i></span>
                                <input type="password" name="secret_code" id="secret_code" class="form-control bg-light border-start-0" placeholder="DEMO CODE: ERPADMIN2026" required>
                            </div>
                            <div class="form-text small text-muted">Use code: <strong>ERPADMIN2026</strong> for testing.</div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-3 mb-3 shadow-sm border-0 bg-danger">
                            <i class="bi bi-shield-check me-1"></i> Register Admin
                        </button>
                    </form>
                    
                    <div class="text-center">
                        <span class="text-muted small">Already registered?</span>
                        <a href="{% url 'admin_login' %}" class="text-danger small fw-semibold text-decoration-none ms-1">Log in here</a>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="{% url 'home' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return Home</a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
